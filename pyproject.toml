[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
markers = [
    "db: needs a reachable warehouse (WAREHOUSE_* environment variables)",
]
