# One selector per layer: its models plus its singular tests. Used by the DAG
# (`dbt build --selector silver`, then `--selector gold`) and by hand.
# Singular tests are listed by path because, with DBT_INDIRECT_SELECTION=cautious, a test whose
# parents span two layers (gold vs silver reconciliation) would otherwise never be selected.
selectors:
  - name: silver
    definition:
      union:
        - method: path
          value: models/silver
        - method: path
          value: tests/silver

  - name: gold
    definition:
      union:
        - method: path
          value: models/gold
        - method: path
          value: tests/gold

  # Targeted reprocessing (dummyjson_reprocess, with --vars force_date): the day models plus the
  # singular tests of both layers. Tests that read a bronze source (row counts) aren't picked up
  # by model selection under cautious indirect selection, so they're listed by path.
  # silver.products is excluded: reprocessing a past day would take it back to an older state.
  - name: reprocess
    definition:
      union:
        - method: fqn
          value: carts
        - method: fqn
          value: cart_items
        - method: fqn
          value: product_daily_revenue
        - method: path
          value: tests/silver
        - method: path
          value: tests/gold
