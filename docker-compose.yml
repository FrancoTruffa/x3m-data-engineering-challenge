# Local stack: Airflow 3 (LocalExecutor) + Postgres for Airflow metadata + Postgres warehouse.
# All credentials below are local development defaults, not secrets.

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    target: runtime
  image: x3m-airflow:3.3.2
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: local_dev_jwt_secret
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Ingestion package (src/ingestion) importable from DAGs and tasks.
    PYTHONPATH: /opt/airflow/src
    WAREHOUSE_HOST: warehouse
    WAREHOUSE_PORT: '5432'
    WAREHOUSE_DB: warehouse
    WAREHOUSE_USER: warehouse
    WAREHOUSE_PASSWORD: warehouse
    # dbt project is mounted read-only; artifacts go to writable paths inside the container.
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    # A test runs only when all of its parents are selected: building silver must not run the
    # gold-vs-silver reconciliation test before gold is rebuilt.
    DBT_INDIRECT_SELECTION: cautious
    # No calls to external services from the pipeline.
    DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./dbt:/opt/airflow/dbt:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    airflow-metadata-db:
      condition: service_healthy

services:
  airflow-metadata-db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  warehouse:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "${WAREHOUSE_PORT:-15432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse", "-d", "warehouse"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      warehouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Lint + tests, on demand: `docker compose run --rm tests` (see README).
  # Arguments are passed to `python -m`, e.g. `docker compose run --rm tests ruff check .`.
  tests:
    <<: *airflow-common
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      target: dev
    image: x3m-airflow-dev:3.3.2
    profiles: ["dev"]
    entrypoint: ["python", "-m"]
    command: ["pytest"]
    working_dir: /opt/airflow/project
    environment:
      <<: *airflow-common-env
      PYTHONPATH: /opt/airflow/project/src
      PYTHONDONTWRITEBYTECODE: '1'
      RUFF_CACHE_DIR: /tmp/ruff-cache
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    volumes:
      - .:/opt/airflow/project:ro
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  airflow-metadata-db-data:
  warehouse-data:
  airflow-logs:
